name: Construire l'APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Télécharger three.js (inclus dans l'application, pour jouer hors ligne)
        run: curl -L -f -o www/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Monde-Ouvert-RPG-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
